<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propel — Resultados de eventos presenciales: IA para el Impacto Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --o1:#F26322;--o2:#E8401A;
  --bg:#F6F3F0;--card:#fff;--mod:#EEE9E5;
  --t1:#063330;--t2:#4A6360;--t3:#8FAAA7;
  --bd:rgba(6,51,48,.09);--bd2:rgba(6,51,48,.18);
  --r:5px;
}
*:focus{outline:none}
html,body{height:100%;width:100%;background:var(--bg);font-family:'Libre Franklin',sans-serif;color:var(--t1);overflow:hidden}

/* HEADER */
.hdr{height:86px;background:linear-gradient(108deg,var(--o1),var(--o2));display:flex;align-items:center;padding:0 28px;flex-shrink:0;gap:0}
.hdr-brand{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex-shrink:0;padding-left:24px}
.hdr-div{display:none}
.hdr-title{font-size:clamp(13px,1.15vw,16px);font-weight:400;color:#fff;letter-spacing:-.01em;line-height:1.3;flex:1;max-width:none}

/* SHELL */
.app{display:flex;flex-direction:column;height:100vh;width:100vw}
.body{flex:1;display:grid;grid-template-columns:1fr 480px;overflow:hidden;min-height:0}
.left{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;min-height:0}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex-shrink:0}
.kpi{background:var(--card);border:.5px solid var(--bd);border-radius:var(--r);padding:14px 18px}
.kpi-lbl{font-size:9px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.kpi-val{font-family:'DM Mono',monospace;font-size:clamp(24px,2.4vw,36px);font-weight:500;color:var(--t1);letter-spacing:-.02em;line-height:1}
.kpi-sub{font-size:10px;color:var(--t3);margin-top:4px}

/* MAP */
.map-wrap-outer{flex:1;overflow:hidden;min-height:0}
.map-card{background:var(--card);border:.5px solid var(--bd);border-radius:var(--r);display:flex;flex-direction:column;height:100%;overflow:hidden}
.map-head{padding:10px 16px;border-bottom:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.map-head-title{font-size:11px;font-weight:600;color:var(--t1)}
.map-head-hint{font-size:10px;color:var(--t3)}
.map-body{flex:1;position:relative;overflow:hidden;min-height:0}
#map-svg{position:absolute;top:0;left:0;width:100%;height:100%}

/* Bubbles — default orange, active darker orange */
.map-tag{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);pointer-events:none}
.mtb{
  background:var(--o1);
  border-radius:6px;padding:6px 13px;
  display:flex;flex-direction:column;align-items:center;min-width:54px;
  cursor:pointer;pointer-events:all;
  transition:background .15s,transform .15s;
  box-shadow:0 2px 12px rgba(232,64,26,.35);
}
.mtb:hover{background:#d4541a;transform:scale(1.06)}
.mtb.active{background:var(--o2)}
.mtn{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:#fff;line-height:1}
.mtl{font-family:'Libre Franklin',sans-serif;font-size:8px;color:rgba(255,255,255,.85);margin-top:2px;white-space:nowrap}
/* Tail — default orange */
.mtt{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--o1);transition:border-top-color .15s}
.mtb.active+.mtt{border-top-color:var(--o2)}

/* RIGHT */
.right{border-left:.5px solid var(--bd);background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.p-hdr{padding:14px 18px 12px;flex-shrink:0;background:linear-gradient(108deg,var(--o1),var(--o2))}
.p-country{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.p-flag{font-size:20px}
.p-name{font-size:16px;font-weight:600;color:#fff;letter-spacing:-.01em}
.p-event{font-size:10px;color:rgba(255,255,255,.65)}

.tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:.5px solid var(--bd);flex-shrink:0}
.tab{flex:1;padding:7px 3px;border:.5px solid var(--bd);border-radius:var(--r);background:var(--mod);cursor:pointer;text-align:center;font-family:'Libre Franklin',sans-serif;color:var(--t2);transition:all .13s;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab:hover{border-color:var(--o1)}
.tab.active{background:var(--o1);border-color:var(--o1);color:#fff}
.tab-flag{font-size:15px}
.tab-name{font-size:10px;font-weight:500}

.p-body{flex:1;overflow-y:auto;padding:13px 16px;display:flex;flex-direction:column;gap:9px}
.p-body::-webkit-scrollbar{width:3px}
.p-body::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.p-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--t3);font-size:13px;text-align:center;padding:40px}

.sec-lbl{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);padding:2px 0 4px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.si{background:var(--mod);border-radius:var(--r);padding:11px 13px}
.si-hi{background:rgba(242,99,34,.08);border:.5px solid rgba(242,99,34,.3);border-radius:var(--r);padding:11px 13px}
.sl{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.sv{font-family:'DM Mono',monospace;font-size:clamp(20px,1.8vw,26px);font-weight:500;color:var(--t1);letter-spacing:-.02em;line-height:1}
.mod{background:var(--mod);border-radius:var(--r);padding:11px 13px}
.br{margin-bottom:8px}
.bm{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:3px}
.bp{font-family:'DM Mono',monospace;font-weight:500;color:var(--t1)}
.mb{height:4px;border-radius:3px;background:var(--bd);overflow:hidden}
.mf{height:100%;border-radius:3px;background:var(--o1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;color:var(--t2);background:var(--card);border:.5px solid var(--bd);padding:4px 10px;border-radius:20px;text-decoration:none;transition:border-color .13s,color .13s,background .13s}
.chip:hover{border-color:var(--o1);color:var(--o1);background:rgba(242,99,34,.04)}

/* ── MOBILE RESPONSIVE ── */
@media (max-width: 768px) {
  html,body { overflow:auto }

  .app { height:auto; min-height:100vh }

  /* Stack header vertically on small screens */
  .hdr { height:auto; padding:14px 16px; flex-wrap:wrap; gap:10px }
  .hdr-title { font-size:13px; order:-1; width:100% }
  .hdr-brand { flex-direction:row; align-items:center; gap:12px }

  /* Stack body vertically */
  .body { grid-template-columns:1fr; overflow:visible; height:auto }

  /* Left panel */
  .left { padding:12px; gap:10px; overflow:visible }

  /* KPIs: 1 column on very small, 3 on medium mobile */
  .kpi-row { grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px }
  .kpi { padding:10px 12px }
  .kpi-val { font-size:22px }

  /* Map fixed height on mobile */
  .map-wrap-outer { min-height:320px; height:50vw; max-height:400px }

  /* Right panel full width below map */
  .right { border-left:none; border-top:.5px solid var(--bd) }

  /* Panel body no scroll constraint */
  .p-body { overflow:visible; flex:none }

  /* Tabs */
  .tabs { padding:8px 12px }
  .tab { padding:8px 4px }
  .tab-flag { font-size:18px }
  .tab-name { font-size:11px }

  /* Stat grids */
  .sg { grid-template-columns:1fr 1fr; gap:6px }
  .sv { font-size:20px }

  /* Bubbles slightly smaller */
  .mtn { font-size:12px }
  .mtl { font-size:7px }
}

@media (max-width: 480px) {
  .kpi-row { grid-template-columns:1fr 1fr; gap:6px }
  .kpi-val { font-size:20px }
  .hdr-title { font-size:12px }
}
</style>
</head>

      <div class="si"><div class="sl">Registradas</div><div class="sv">${fmt(d.o_reg)}</div></div>

    </div>

}

function sel(k){ renderPanel(k); }

const AMERICAS=new Set(['840','484','124','320','188','222','558','340','591','332','214','388','192','076','170','068','604','218','862','858','600','032','152','630','780','308','052','084','328','740','534','533','535','531','530','663','659','660','028','044','136','474','670','678','796']);
const EV={'484':'mx','032':'ar','152':'cl'};

function buildMap(){
  const body=document.getElementById('map-body');
  const W=body.clientWidth,H=body.clientHeight;
  if(!W||!H) return;
  body.querySelectorAll('.map-tag').forEach(t=>t.remove());
  const svgEl=document.getElementById('map-svg');
  const svg=d3.select(svgEl);
  svg.selectAll('g').remove();
  svgEl.setAttribute('viewBox',`0 0 ${W} ${H}`);
  // Scale based on the smaller dimension so entire Americas always fits
  const scale = Math.min(W, H) * 0.58;
  const proj=d3.geoMercator().scale(scale).center([-82,-4]).translate([W*0.46,H*0.46]);
  const pathG=d3.geoPath().projection(proj);
  const STEP=Math.max(4,W*0.007);
  const DR=STEP*0.22,DRev=STEP*0.32;
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world=>{
    const feats=topojson.feature(world,world.objects.countries).features
      .filter(f=>AMERICAS.has(String(f.id).padStart(3,'0')));
    const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext('2d');
    const dots={ev:{},gry:[]};
    feats.forEach(f=>{
      const id3=String(f.id).padStart(3,'0'),ek=EV[id3];
      ctx.clearRect(0,0,W,H);
      const p2d=new Path2D(pathG(f));ctx.fill(p2d);
      const arr=[];
      for(let x=STEP/2;x<W;x+=STEP) for(let y=STEP/2;y<H;y+=STEP) if(ctx.isPointInPath(p2d,x,y)) arr.push([x,y]);
      if(ek) dots.ev[ek]=(dots.ev[ek]||[]).concat(arr);
      else dots.gry=dots.gry.concat(arr);
    });
    const gG=svg.append('g');
    dots.gry.forEach(([x,y])=>gG.append('circle').attr('cx',x).attr('cy',y).attr('r',DR).attr('fill','#C4BCB4'));
    const eG=svg.append('g');
    Object.entries(dots.ev).forEach(([k,pts])=>{
      pts.forEach(([x,y])=>{
        eG.append('circle').attr('cx',x).attr('cy',y).attr('r',DRev)
          .attr('fill','url(#gr-ev)').attr('class','dot-ev').attr('data-key',k)
          .style('cursor','pointer').on('click',()=>sel(k));
      });
    });
    Object.entries(PINS).forEach(([k,{lon,lat,label}])=>{
      const [px,py]=proj([lon,lat]);
      const tag=document.createElement('div');
      tag.className='map-tag';tag.id='tag-'+k;
      tag.style.left=px+'px';tag.style.top=(py-6)+'px';
      tag.innerHTML=`<div class="mtb" data-key="${k}" onclick="sel('${k}')">
        <span class="mtn">${DATA[k].o_cap}</span>
        <span class="mtl">${label}</span>
      </div><div class="mtt"></div>`;
      body.appendChild(tag);
    });
  }).catch(()=>{});
}

window.addEventListener('load',()=>setTimeout(buildMap,80));
let rt;
new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(buildMap,150);})
  .observe(document.getElementById('map-body'));
</script>
</body>
